<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style_todo.css">
</head>

<body>
  <h1 class="logo">EST Todo List</h1>
   <nav class="nav">
      <ul>
       <li>JSの練習をします</li>
      </ul>
    </nav>
<button id="add-btn">追加</button>
<input id="task-input" type="text">
<ul id="task-list"></ul>

<h2>完了済み</h2>
<ul id="done-list"></ul>

<h3>削除済み</h3>
<ul id="delete-List"></ul>

<script>
const addBtn = document.getElementById('add-btn');
const taskInput = document.getElementById('task-input');
const taskList = document.getElementById('task-list');
const doneList = document.getElementById('done-list');
const deleteList = document.getElementById('delete-List');
const STORAGE_KEY = 'est-todo-tasks';

let tasks = loadTasks();

function loadTasks() {
  try {
    const savedTasks = localStorage.getItem(STORAGE_KEY);

    if (!savedTasks) {
      return [];
    }

    const parsedTasks = JSON.parse(savedTasks);

    if (!Array.isArray(parsedTasks)) {
      throw new Error('保存データが配列ではありません');
    }

    return parsedTasks.filter((task) => (
      task &&
      typeof task.id === 'string' &&
      typeof task.title === 'string' &&
      ['active', 'done', 'deleted'].includes(task.status)
    ));
  } catch (error) {
    console.error('Todoデータの読み込みに失敗しました', error);
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (removeError) {
      console.error('不正なTodoデータを削除できませんでした', removeError);
    }
    return [];
  }
}

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (error) {
    console.error('Todoデータの保存に失敗しました', error);
    alert('Todoを保存できませんでした。ブラウザーの保存設定を確認してください。');
  }
}

function createTask(title) {
  return {
    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    title,
    status: 'active'
  };
}

function addButton(label, onClick) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = label;
  button.style.marginLeft = '10px';
  button.addEventListener('click', onClick);
  return button;
}

function renderTasks() {
  taskList.innerHTML = '';
  doneList.innerHTML = '';
  deleteList.innerHTML = '';

  tasks.forEach((task) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = task.title;
    li.appendChild(span);

    if (task.status === 'active') {
      li.appendChild(addButton('完了', () => {
        task.status = 'done';
        saveTasks();
        renderTasks();
      }));
      taskList.appendChild(li);
    } else if (task.status === 'done') {
      doneList.appendChild(li);
    } else {
      deleteList.appendChild(li);
    }

    if (task.status !== 'deleted') {
      li.appendChild(addButton('削除', () => {
        task.status = 'deleted';
        saveTasks();
        renderTasks();
      }));
    }
  });
}

addBtn.addEventListener('click', () => {
  const text = taskInput.value.trim();

  if (text === '') {
    alert('タスクを入力してください');
    return;
  }

  tasks.push(createTask(text));
  saveTasks();
  renderTasks();
  taskInput.value = '';
});

taskInput.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    addBtn.click();
  }
});

renderTasks();
</script>


</body>
